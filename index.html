<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="screen-orientation" content="landscape">
  <title>Heartwood</title>
  <link id="-gd-engine-icon" rel="icon" type="image/png" href="index.icon.png" />
<link rel="apple-touch-icon" href="index.apple-touch-icon.png"/>

  <style>
    :root { color-scheme: dark; background: #07140e; font: 14px system-ui, sans-serif; }
    * { box-sizing: border-box; }
    html, body { width: 100%; height: 100%; margin: 0; overflow: hidden; overscroll-behavior: none; touch-action: none; user-select: none; }
    body { background: radial-gradient(circle at 50% 35%, #173626, #07140e 68%); }
    #canvas { display: block; width: 100vw; height: 100dvh; outline: 0; touch-action: none; }
    #status { position: fixed; inset: 0; display: grid; place-items: center; pointer-events: none; color: #d8dcb2; letter-spacing: .08em; text-transform: uppercase; }
    #rotate { display: none; position: fixed; inset: 0; place-items: center; padding: 2rem; text-align: center; background: rgba(7,20,14,.94); color: #d8dcb2; z-index: 4; }
    #version { position: fixed; right: max(10px,env(safe-area-inset-right)); bottom: max(8px,env(safe-area-inset-bottom)); color: rgba(216,220,178,.62); font-size: 11px; z-index: 3; pointer-events: none; }
    @media (orientation: portrait) { #rotate { display: grid; } }
    @media (max-height: 500px) { #version { top: max(6px,env(safe-area-inset-top)); bottom: auto; } }
  </style>
</head>
<body>
  <canvas id="canvas" aria-label="Heartwood game canvas">Your browser needs canvas support.</canvas>
  <div id="status" role="status">Loading the forest…</div>
  <div id="rotate">Rotate your device to landscape to enter the canopy.</div>
  <div id="version">Heartwood Web Alpha 0.0.10 · 2026-11-23</div>
  <script src="index.js"></script>
  <script>
    const statusNode = document.getElementById('status');
    const canvas = document.getElementById('canvas');
    const engine = new Engine({"args":[],"canvasResizePolicy":2,"emscriptenPoolSize":8,"ensureCrossOriginIsolationHeaders":false,"executable":"index","experimentalVK":false,"fileSizes":{"index.pck":402253068,"index.wasm":39514754},"focusCanvas":true,"gdextensionLibs":[],"godotPoolSize":4});
    const fail = (error) => {
      console.error(error);
      statusNode.textContent = 'The forest could not load. Refresh to try again.';
    };
    // Hosting splits the pack into parts under 50 MB (GitHub's file limit); pck_parts.json lists them.
    // Without that file (a local, unsplit export) the standard loader runs.
    const progress = { engineDone: 0, engineTotal: 0, partsDone: 0, partsTotal: 0 };
    const showProgress = () => {
      const total = progress.engineTotal + progress.partsTotal;
      if (total > 0) statusNode.textContent = 'Loading the forest… ' + Math.floor(100 * (progress.engineDone + progress.partsDone) / total) + '%';
    };
    const onProgress = (done, total) => { progress.engineDone = done; progress.engineTotal = total; showProgress(); };
    const readPart = async (url, into, offset) => {
      const response = await fetch(url);
      if (!response.ok) throw new Error(url + ' ' + response.status);
      const reader = response.body.getReader();
      for (;;) {
        const { done, value } = await reader.read();
        if (done) return offset;
        into.set(value, offset);
        offset += value.length;
        progress.partsDone += value.length;
        showProgress();
      }
    };
    const loadSplitPack = async (list) => {
      progress.partsTotal = list.size;
      const pack = new Uint8Array(list.size);
      let offset = 0;
      for (const part of list.parts) offset = await readPart(part, pack, offset);
      if (offset !== list.size) throw new Error('pack size ' + offset + ' != ' + list.size);
      return pack;
    };
    const run = async () => {
      let list = null;
      try {
        const response = await fetch('pck_parts.json', { cache: 'no-cache' });
        if (response.ok) list = await response.json();
      } catch (error) { list = null; }
      if (!list) return engine.startGame({ canvas, onProgress });
      engine.config.update({ canvas, onProgress, args: ['--main-pack', list.name] });
      const [, pack] = await Promise.all([engine.init(engine.config.executable), loadSplitPack(list)]);
      // An ArrayBuffer, not the Uint8Array: preloadFile uses its argument as an object key.
      await engine.preloadFile(pack.buffer, list.name);
      return engine.start();
    };
    if (!Engine.isWebGLAvailable()) {
      fail(new Error('WebGL unavailable'));
    } else {
      run().then(() => statusNode.remove()).catch(fail);
    }
    for (const eventName of ['touchmove','gesturestart','gesturechange','gestureend']) {
      document.addEventListener(eventName, event => event.preventDefault(), { passive: false });
    }
    document.addEventListener('contextmenu', event => event.preventDefault());
  </script>
</body>
</html>
